<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stock Manager - Inventory & Order Review</title>
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- CSS Stylesheet -->
  <link rel="stylesheet" href="/css/style.css?v=1.0.2">
</head>
<body>
  <div id="app-container" class="app-layout">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="logo-wrapper">
          <span class="logo-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width: 20px; height: 20px; color: var(--text-primary);">
              <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
            </svg>
          </span>
          <span class="logo-text">StockManager</span>
        </div>
        <button id="desktop-sidebar-toggle" class="desktop-toggle-btn" aria-label="Collapse Sidebar">
          <span class="toggle-icon">◀</span>
        </button>
      </div>
      <nav class="sidebar-nav">
        <a href="/" class="nav-item active" data-link title="Dashboard">
          <span class="nav-icon">
            <svg viewBox="0 0 24 24"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="10" rx="1"/><rect width="7" height="5" x="3" y="15" rx="1"/></svg>
          </span> 
          <span class="nav-text">Dashboard</span>
        </a>
        <a href="/products" class="nav-item" data-link title="Products">
          <span class="nav-icon">
            <svg viewBox="0 0 24 24"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>
          </span>
          <span class="nav-text">Products</span>
        </a>
        <a href="/import" class="nav-item" data-link title="Import Excel">
          <span class="nav-icon">
            <svg viewBox="0 0 24 24"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M8 13h8"/><path d="M8 17h8"/><path d="M10 9H8v8"/></svg>
          </span>
          <span class="nav-text">Import Excel</span>
        </a>
        <a href="/review" class="nav-item" data-link title="Pending Review">
          <span class="nav-icon">
            <svg viewBox="0 0 24 24"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
          </span>
          <span class="nav-text">Pending Review</span>
          <span id="badge-pending" class="badge hidden">0</span>
        </a>
        <a href="/stock-history" class="nav-item" data-link title="Stock History">
          <span class="nav-icon">
            <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>
          </span>
          <span class="nav-text">Stock History</span>
        </a>
        <a href="/opname" class="nav-item" data-link title="Stock Opname">
          <span class="nav-icon">
            <svg viewBox="0 0 24 24"><rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="m9 14 2 2 4-4"/></svg>
          </span>
          <span class="nav-text">Stock Opname</span>
        </a>
        <a href="/settings" class="nav-item" data-link title="Settings">
          <span class="nav-icon">
            <svg viewBox="0 0 24 24"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.1a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
          </span>
          <span class="nav-text">Settings</span>
        </a>
      </nav>
      <div class="sidebar-footer">
        <div class="user-profile" title="User Profile">
          <span class="user-avatar">
            <svg viewBox="0 0 24 24"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          </span>
          <div class="user-info">
            <div id="user-display-name" class="user-name">Admin</div>
            <div id="user-display-role" class="user-role">Administrator</div>
          </div>
        </div>
        <button id="btn-logout" class="btn-logout" title="Logout">
          <span class="nav-icon">
            <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          </span> 
          <span class="logout-text">Logout</span>
        </button>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content">
      <header class="content-header">
        <div class="header-title-container">
          <button id="sidebar-toggle" class="sidebar-toggle-btn" aria-label="Toggle Navigation">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
          </button>
          <h1 id="page-title">Dashboard</h1>
        </div>
        <div class="header-actions">
          <span id="connection-status" class="status-indicator online">Online</span>
        </div>
      </header>
      
      <!-- Dynamic Content Render Target -->
      <div id="content-body" class="content-body">
        <!-- Views will be dynamically loaded here -->
      </div>
    </main>
  </div>

  <!-- Login Container -->
  <div id="login-container" class="login-layout hidden">
    <div class="login-card">
      <div class="login-header">
        <span class="login-logo">
          <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width: 44px; height: 44px; margin: 0 auto; color: var(--text-primary); display: block; margin-bottom: 1rem;">
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
          </svg>
        </span>
        <h2>Stock Manager</h2>
        <p>Please log in to manage your stock</p>
      </div>
      <form id="login-form" class="login-form">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" required placeholder="Enter username" autocomplete="username">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required placeholder="Enter password" autocomplete="current-password">
        </div>
        <div id="login-error" class="login-error-message hidden"></div>
        <button type="submit" class="btn-submit">Log In</button>
      </form>
    </div>
  </div>

  <!-- Notification Toast Container -->
  <div id="toast-container" class="toast-container"></div>

  <!-- JS Scripts -->
  <script src="/js/app.js?v=1.0.3" type="module"></script>
</body>
</html>
